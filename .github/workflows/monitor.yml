name: Monitor Financiero Colmena V4

on:
  schedule:
    # Mantenemos tus horarios originales por si mañana lo dejas fijo
    - cron: '0 13,14,16,18,20,21 * * 1-5'
  workflow_dispatch: # Esto permite el botón "Run workflow" para la prueba de ahora

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # Damos margen por si la API tarda un poco
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas matplotlib

      - name: Run Monitor Colmena
        env:
          # Estos nombres deben coincidir EXACTO con tus Secrets en GitHub settings
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "America/Argentina/Buenos_Aires"
        run: python main.py

      - name: Guardar Memoria y Sincronizar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Agregamos los archivos de la prueba para que queden en tu repo
          git add prueba_cierre_al30.csv grafico_prueba.png || true
          git commit -m "Bot: Captura de cierre de mercado [skip ci]" || echo "Sin cambios"
          git push
