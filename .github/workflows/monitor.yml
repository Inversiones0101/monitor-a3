name: Monitor Financiero Pro
on:
  schedule:
    # 12:55 UTC es 09:55 ARG (5 min antes de abrir para calentar motores)
    # 21:05 UTC es 18:05 ARG (Justo después de la limpieza final)
    # Corre de lunes (1) a viernes (5)
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch: # Permite correrlo manualmente para probar

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests pandas matplotlib beautifulsoup4 lxml

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_dia.csv || true
          # Solo hace commit si el archivo cambió (nuevos datos) o si fue borrado (limpieza 18hs)
          git commit -m "Actualizar historial/limpieza [skip ci]" || echo "Sin cambios"
          git push
