name: Monitor A3 Realtime
on:
  schedule:
    - cron: '*/5 13-21 * * 1-5' # Cada 5 min, de 10hs a 18hs (horario UTC) de lunes a viernes
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAE_API_KEY: ${{ secrets.MAE_API_KEY }}  # <--- AGREGÁ ESTA LÍNEA SI NO ESTÁ
        run: python main.py

      - name: Commit changes
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add datos_dia.csv
          git commit -m "Actualizar precios intradía [skip ci]" || echo "No hay cambios"
          git push
