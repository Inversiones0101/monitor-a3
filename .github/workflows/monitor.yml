name: Monitor Financiero Pro
on:
  schedule:
    # 13:00 a 20:55 UTC (aprox 10:00 a 17:55 ARG con TZ configurado)
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests pandas matplotlib beautifulsoup4 lxml

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: "America/Argentina/Buenos_Aires"
        run: python main.py  # <--- ¡ESTA LÍNEA ES VITAL PARA QUE ARRANQUE!

      - name: Save History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_dia.csv || true
          git commit -m "Actualizar historial/limpieza [skip ci]" || echo "Sin cambios"
          git push
