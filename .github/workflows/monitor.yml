name: Monitor A3 Realtime
on:
  schedule:
    - cron: '*/5 13-21 * * 1-5' # De 10hs a 18hs ARG
  workflow_dispatch:

permissions:
  contents: write  # Correcto: permite escribir en el repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests pandas matplotlib beautifulsoup4 lxml

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_dia.csv || true 
          # Solo hace commit si hay cambios reales en el archivo
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar precios [skip ci]" && git push)
