name: Monitor A3 Realtime
on:
  schedule:
    - cron: '*/5 13-21 * * 1-5' # De 10hs a 18hs ARG
  workflow_dispatch:

permissions:
  contents: write  # <--- ESTO ES CLAVE para que el bot pueda guardar el CSV

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install deps
        run: pip install requests pandas matplotlib

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit changes
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          # El '|| true' evita que el workflow se ponga rojo si el archivo no está
          git add datos_dia.csv || true 
          git commit -m "Actualizar precios desde grafico [skip ci]" || echo "No hay cambios para guardar"
          git push || echo "Nada para subir"
          
